<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabalı İşe Gidiş Takip Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .current-driver {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .current-driver .driver-name {
            font-size: 2.5em;
            color: #667eea;
            font-weight: bold;
            margin: 10px 0;
        }

        .current-driver .week-info {
            color: #666;
            font-size: 1.1em;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .user-list {
            list-style: none;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .user-item:hover {
            background: #e9ecef;
        }

        .user-item .user-name {
            font-weight: 600;
            color: #333;
        }

        .user-item .user-actions {
            display: flex;
            gap: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section h4 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .loading-spinner {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .driver-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .driver-option {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
        }

        .driver-option:hover {
            background: #667eea;
            color: white;
        }

        .driver-option.selected {
            background: #667eea;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .week-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .week-nav button {
            padding: 10px 20px;
            font-size: 1.2em;
        }

        .week-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Arabalı İşe Gidiş Takip Sistemi</h1>
        
        <div id="statusMessage" class="status-message"></div>

        <div class="card">
            <h2>Bu Haftanın Sürücüsü</h2>
            <div id="currentDriverSection" class="loading">
                <div class="loading-spinner">⏳</div>
                <p>Yükleniyor...</p>
            </div>
            <div id="driverChangeSection" style="display: none;">
                <div class="week-nav">
                    <button class="btn btn-secondary" onclick="changeWeek(-1)">◀ Önceki</button>
                    <span class="week-number" id="weekNumberDisplay">Hafta 1</span>
                    <button class="btn btn-secondary" onclick="changeWeek(1)">Sonraki ▶</button>
                </div>
                <div class="current-driver">
                    <p>Bu haftanın sürücüsü:</p>
                    <div class="driver-name" id="currentDriverName">Yükleniyor...</div>
                    <div class="week-info" id="weekInfo">Yükleniyor...</div>
                </div>
                <p>Sürücüyü değiştir:</p>
                <div id="driverSelector" class="driver-selector"></div>
            </div>
        </div>

        <div class="card">
            <h2>Kullanıcılar</h2>
            <ul id="userList" class="user-list">
                <li class="loading">Yükleniyor...</li>
            </ul>
            <button class="btn btn-primary" onclick="openAddUserModal()">+ Yeni Kullanıcı Ekle</button>
        </div>

        <div class="card">
            <h2>Bot Ayarları</h2>
            <button class="btn btn-primary" onclick="openSettingsModal()">⚙️ Ayarlar</button>
            <button class="btn btn-success" onclick="testBot()">🔗 Bot Bağlantısını Test Et</button>
            <button class="btn btn-secondary" onclick="sendReminder()">📤 Test Mesajı Gönder</button>
        </div>
    </div>

    <!-- Kullanıcı Ekleme/Düzenleme Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="userModalTitle">Yeni Kullanıcı Ekle</h3>
                <button class="close-btn" onclick="closeUserModal()">&times;</button>
            </div>
            <form id="userForm" onsubmit="saveUser(event)">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="userName">İsim:</label>
                    <input type="text" id="userName" required placeholder="Kişinin adını girin">
                </div>
                <button type="submit" class="btn btn-primary">Kaydet</button>
                <button type="button" class="btn btn-secondary" onclick="closeUserModal()">İptal</button>
            </form>
        </div>
    </div>

    <!-- Ayarlar Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Ayarlar</h3>
                <button class="close-btn" onclick="closeSettingsModal()">&times;</button>
            </div>
            <form id="settingsForm" onsubmit="saveSettings(event)">
                <div class="settings-section">
                    <h4>Telegram Bot Ayarları</h4>
                    <div class="form-group">
                        <label for="botToken">Bot Token:</label>
                        <input type="text" id="botToken" placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
                    </div>
                    <div class="form-group">
                        <label for="chatId">Grup Chat ID:</label>
                        <input type="text" id="chatId" placeholder="-100123456789">
                    </div>
                </div>

                <div class="settings-section">
                    <h4>Hatırlatma Zamanı</h4>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label for="reminderDay">Hatırlatma Günü:</label>
                            <select id="reminderDay">
                                <option value="0">Pazar</option>
                                <option value="1">Pazartesi</option>
                                <option value="2">Salı</option>
                                <option value="3">Çarşamba</option>
                                <option value="4">Perşembe</option>
                                <option value="5">Cuma</option>
                                <option value="6">Cumartesi</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="reminderHour">Hatırlatma Saati:</label>
                            <select id="reminderHour">
                                <script>
                                    for (let i = 0; i < 24; i++) {
                                        document.write(`<option value="${i}">${i.toString().padStart(2, '0')}:00</option>`);
                                    }
                                </script>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="reminderMinute">Hatırlatma Dakikası:</label>
                            <select id="reminderMinute">
                                <script>
                                    for (let i = 0; i < 60; i += 5) {
                                        document.write(`<option value="${i}">${i.toString().padStart(2, '0')}</option>`);
                                    }
                                </script>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h4>Rotasyon Başlangıcı</h4>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label for="rotationStartYear">Başlangıç Yılı:</label>
                            <input type="number" id="rotationStartYear" min="2020" max="2100">
                        </div>
                        <div class="form-group">
                            <label for="rotationStartWeek">Başlangıç Haftası:</label>
                            <input type="number" id="rotationStartWeek" min="1" max="53">
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="submit" class="btn btn-success">💾 Ayarları Kaydet</button>
                    <button type="button" class="btn btn-secondary" onclick="closeSettingsModal()">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let settings = {
            botToken: '',
            chatId: '',
            reminderDay: 5,
            reminderHour: 18,
            reminderMinute: 0,
            users: [],
            rotationStartWeek: 1,
            rotationStartYear: 2025
        };

        let currentWeekOffset = 0;
        let currentYear = new Date().getFullYear();
        let currentWeekNum = getWeekNumber(new Date());

        function getCurrentTokenValue() {
            const input = document.getElementById('botToken');
            return input && input.value.trim() ? input.value.trim() : (settings.botToken || '');
        }

        function getCurrentChatIdValue() {
            const input = document.getElementById('chatId');
            return input && input.value.trim() ? input.value.trim() : (settings.chatId || '');
        }

        // API Base URL
        const API_BASE = '';

        // API fonksiyonları
        async function apiGet(endpoint) {
            const response = await fetch(`${API_BASE}${endpoint}`);
            if (!response.ok) {
                throw new Error(`API hatası: ${response.status}`);
            }
            return response.json();
        }

        async function apiPost(endpoint, data) {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || `API hatası: ${response.status}`);
            }
            return response.json();
        }

        // Hafta numarasını hesapla
        function getWeekNumber(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // Tarih formatla
        function formatDate(date) {
            return date.toLocaleDateString('tr-TR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        // Haftanın başlangıç ve bitiş tarihini hesapla
        function getWeekDates(weekNum, year) {
            const simple = new Date(Date.UTC(year, 0, 1 + (weekNum - 1) * 7));
            const dow = simple.getDay();
            const weekStart = simple;
            if (dow <= 4) {
                weekStart.setDate(simple.getDate() - simple.getDay() + 1);
            } else {
                weekStart.setDate(simple.getDate() + 8 - simple.getDay());
            }
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekEnd.getDate() + 6);
            return { start: weekStart, end: weekEnd };
        }

        // O anki haftanın sürücüsünü hesapla
        function getCurrentDriver(weekNum, year) {
            if (settings.users.length === 0) return { name: 'Kullanıcı yok', index: -1 };

            const baseWeek = settings.rotationStartWeek || 1;
            const baseYear = settings.rotationStartYear || year;
            
            // Basit hafta hesaplama
            let effectiveWeek = (weekNum - baseWeek);
            if (year > baseYear) {
                effectiveWeek += (year - baseYear) * 52;
            }
            
            // Negatif hafta kontrolü
            while (effectiveWeek < 0) {
                effectiveWeek += settings.users.length;
            }

            const driverIndex = effectiveWeek % settings.users.length;
            return { 
                name: settings.users[driverIndex].name, 
                index: driverIndex,
                weekNum: weekNum,
                year: year
            };
        }

        // Sürücüyü değiştir
        async function changeDriver(newIndex) {
            if (settings.users.length === 0) {
                showStatus('Önce kullanıcı eklemelisiniz!', 'error');
                return;
            }

            const targetWeek = currentWeekNum + currentWeekOffset;
            const current = getCurrentDriver(targetWeek, currentYear);

            if (current.index === -1) {
                showStatus('Sürücü atanamadı!', 'error');
                return;
            }

            // Mevcut ve yeni sürücü isimlerini al
            const driverName = settings.users[current.index].name;
            const newDriverName = settings.users[newIndex].name;
            
            // Aynı kişiyi seçerse uyarı ver
            if (current.index === newIndex) {
                showStatus(`${newDriverName} zaten bu haftanın sürücüsü!`, 'error');
                return;
            }
            
            // Değişikliği yapan kişiyi belirle (şu an sistemi kullanan kişi = mevcut sürücü)
            const changerName = driverName;

            try {
                // Yeni API endpoint'ini kullan
                const result = await apiPost('/api/change-driver', {
                    newDriverIndex: newIndex,
                    changerName: changerName
                });
                
                showStatus(result.message, 'success');
                await loadSettings();
            } catch (error) {
                showStatus('Hata: ' + error.message, 'error');
            }
        }

        // Hafta değiştir
        function changeWeek(delta) {
            currentWeekOffset += delta;
            updateDriverDisplay();
        }

        // Sürücü ekranını güncelle
        function updateDriverDisplay() {
            const targetWeek = currentWeekNum + currentWeekOffset;
            const weekDates = getWeekDates(targetWeek, currentYear);
            
            document.getElementById('weekNumberDisplay').textContent = `Hafta ${targetWeek} (${currentYear})`;
            document.getElementById('weekInfo').textContent = `${formatDate(weekDates.start)} - ${formatDate(weekDates.end)}`;
            
            const driver = getCurrentDriver(targetWeek, currentYear);
            document.getElementById('currentDriverName').textContent = driver.name;
            
            // Sürücü seçiciyi güncelle
            const selector = document.getElementById('driverSelector');
            selector.innerHTML = '';
            
            if (settings.users.length > 0) {
                settings.users.forEach((user, index) => {
                    const btn = document.createElement('div');
                    btn.className = 'driver-option' + (user.name === driver.name ? ' selected' : '');
                    btn.textContent = user.name;
                    btn.onclick = () => changeDriver(index);
                    selector.appendChild(btn);
                });
            }
        }

        // Ayarları yükle
        async function loadSettings() {
            try {
                settings = await apiGet('/api/settings');
                updateUserList();
                updateDriverDisplay();
                const botInput = document.getElementById('botToken');
                const chatInput = document.getElementById('chatId');
                if (botInput && !botInput.value.trim()) botInput.value = settings.botToken || '';
                if (chatInput && !chatInput.value.trim()) chatInput.value = settings.chatId || '';
            } catch (error) {
                showStatus('Ayarlar yüklenemedi: ' + error.message, 'error');
            }
        }

        // Kullanıcı listesini güncelle
        function updateUserList() {
            const userList = document.getElementById('userList');
            
            if (settings.users.length === 0) {
                userList.innerHTML = '<li class="loading">Kullanıcı yok. Yukarıdan kullanıcı ekleyin.</li>';
                return;
            }

            userList.innerHTML = settings.users.map((user, index) => `
                <li class="user-item">
                    <span class="user-name">${index + 1}. ${user.name}</span>
                    <div class="user-actions">
                        <button class="btn btn-secondary btn-sm" onclick="editUser(${index})">Düzenle</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${index})">Sil</button>
                    </div>
                </li>
            `).join('');
        }

        // Kullanıcı modalını aç
        function openAddUserModal() {
            document.getElementById('userModalTitle').textContent = 'Yeni Kullanıcı Ekle';
            document.getElementById('userId').value = '';
            document.getElementById('userName').value = '';
            document.getElementById('userModal').classList.add('active');
        }

        // Kullanıcıyı düzenle
        function editUser(index) {
            const user = settings.users[index];
            document.getElementById('userModalTitle').textContent = 'Kullanıcıyı Düzenle';
            document.getElementById('userId').value = index;
            document.getElementById('userName').value = user.name;
            document.getElementById('userModal').classList.add('active');
        }

        // Kullanıcı modalını kapat
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        // Kullanıcıyı kaydet
        async function saveUser(event) {
            event.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const userName = document.getElementById('userName').value.trim();
            
            if (!userName) {
                showStatus('Lütfen isim girin!', 'error');
                return;
            }

            try {
                if (userId === '') {
                    // Yeni kullanıcı ekle
                    settings.users.push({ name: userName });
                    showStatus(`${userName} eklendi!`, 'success');
                } else {
                    // Mevcut kullanıcıyı güncelle
                    const oldName = settings.users[userId].name;
                    settings.users[userId].name = userName;
                    showStatus(`${oldName} güncellendi!`, 'success');
                }
                
                await apiPost('/api/settings', settings);
                closeUserModal();
                loadSettings();
            } catch (error) {
                showStatus('Hata: ' + error.message, 'error');
            }
        }

        // Kullanıcıyı sil
        async function deleteUser(index) {
            if (!confirm(`${settings.users[index].name} silinsin mi?`)) return;
            
            const deletedName = settings.users[index].name;
            settings.users.splice(index, 1);
            
            try {
                await apiPost('/api/settings', settings);
                showStatus(`${deletedName} silindi!`, 'success');
                loadSettings();
            } catch (error) {
                showStatus('Hata: ' + error.message, 'error');
            }
        }

        // Ayarlar modalını aç
        function openSettingsModal() {
            document.getElementById('botToken').value = settings.botToken || '';
            document.getElementById('chatId').value = settings.chatId || '';
            document.getElementById('reminderDay').value = settings.reminderDay || 5;
            document.getElementById('reminderHour').value = settings.reminderHour || 18;
            document.getElementById('reminderMinute').value = settings.reminderMinute || 0;
            document.getElementById('rotationStartYear').value = settings.rotationStartYear || currentYear;
            document.getElementById('rotationStartWeek').value = settings.rotationStartWeek || currentWeekNum;
            document.getElementById('settingsModal').classList.add('active');
        }

        // Ayarlar modalını kapat
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        // Ayarları kaydet
        async function saveSettings(event) {
            event.preventDefault();
            
            settings.botToken = document.getElementById('botToken').value.trim();
            settings.chatId = document.getElementById('chatId').value.trim();
            settings.reminderDay = parseInt(document.getElementById('reminderDay').value);
            settings.reminderHour = parseInt(document.getElementById('reminderHour').value);
            settings.reminderMinute = parseInt(document.getElementById('reminderMinute').value);
            settings.rotationStartYear = parseInt(document.getElementById('rotationStartYear').value);
            settings.rotationStartWeek = parseInt(document.getElementById('rotationStartWeek').value);

            try {
                const result = await apiPost('/api/settings', settings);
                showStatus('Ayarlar başarıyla kaydedildi!', 'success');
                closeSettingsModal();
                loadSettings();
            } catch (error) {
                showStatus('Hata: ' + error.message, 'error');
            }
        }

        // Bot bağlantısını test et
        async function testBot() {
            const botToken = getCurrentTokenValue();
            const chatId = getCurrentChatIdValue();

            if (!botToken) {
                showStatus('Lütfen önce Bot Token girin!', 'error');
                openSettingsModal();
                return;
            }

            try {
                const result = await apiPost('/api/test-bot', { botToken, chatId });
                const details = result.chatTitle ? ` Grup: ${result.chatTitle}` : '';
                showStatus(`✅ ${result.message} (Bot: @${result.botName})${details}`, 'success');
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        // Hatırlatma mesajı gönder
        async function sendReminder() {
            const botToken = getCurrentTokenValue();
            const chatId = getCurrentChatIdValue();

            if (!botToken || !chatId) {
                showStatus('Lütfen önce Bot Token ve Chat ID ayarlarını girin!', 'error');
                openSettingsModal();
                return;
            }

            const driver = getCurrentDriver(currentWeekNum, currentYear);
            const weekDates = getWeekDates(currentWeekNum, currentYear);
            const message = `🚗 *Bu Haftanın Sürücüsü*\n\n` +
                `📅 *Tarih:* ${formatDate(weekDates.start)} - ${formatDate(weekDates.end)}\n` +
                `👤 *Sürücü:* ${driver.name}\n\n` +
                `_Not: Arabalı işe gidiş sistemi ile hazırlanmıştır._`;

            try {
                await apiPost('/api/send-message', {
                    botToken,
                    chatId,
                    message
                });
                showStatus('✅ Test mesajı başarıyla gönderildi!', 'success');
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        // Durum mesajı göster
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message ' + type;
            
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 5000);
        }

        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('currentDriverSection').style.display = 'none';
            document.getElementById('driverChangeSection').style.display = 'block';
            
            await loadSettings();
        });
    </script>
</body>
</html>
